<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/link-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linkly — Shorten. Share. Track.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  <script>
    (function () {
      var stored = localStorage.getItem("linkly_theme");
      var isLight = stored
        ? stored === "light"
        : window.matchMedia("(prefers-color-scheme: light)").matches;
      if (isLight) document.documentElement.classList.add("light");
    })();
  </script>
</html>
